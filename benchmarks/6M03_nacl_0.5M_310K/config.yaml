pdb_id: "6M03"
description: >-
  SARS-CoV-2 Mpro apo (PDB 6M03) disuelta en agua TIP3P con NaCl 0.5 M a 310 K.
  Condiciones de referencia ("normales") para el benchmark de CHA-MD-BA.

temperature_K: 310
ion_concentration_M: 0.5
ion_positive: NA
ion_negative: CL
pressure_bar: 1.0

forcefield: amber99sb-ildn
water_model: tip3p
box_type: dodecahedron
box_distance_nm: 1.2
dt_ps: 0.002

minimization_nsteps: 50000
nvt_nsteps: 50000          # 100 ps por constante de fuerza
npt_nsteps: 50000          # 100 ps
production_nsteps: 5000000 # 10 ns

nvt_force_constants: [1000, 800, 600, 400, 200]

notes:
  - La estructura cristalina es la forma apo (cadena A, 306 residuos).
  - Se eliminan aguas cristalográficas; el solvente se reconstruye con TIP3P.
  - HIS se trata como HIE para evitar la protonación interactiva de pdb2gmx.
  - 0.5 M NaCl se añade con genion -neutral -conc 0.5.
  - 310 K corresponde a la temperatura fisiológica usada en los despliegues térmicos del pipeline.
